<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invictus — moved</title>
  <meta name="robots" content="noindex" />
  <!-- This site was an old prototype pointing at a retired backend.
       The live Invictus client app is on Vercel. Send everyone there. -->
  <meta http-equiv="refresh" content="0; url=https://invictus-client.vercel.app/" />
  <link rel="canonical" href="https://invictus-client.vercel.app/" />
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0b0c; color: #f2f2f2; text-align: center; padding: 24px;
    }
    .card { max-width: 420px; }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 10px; }
    p { font-size: 14px; line-height: 1.5; color: #b9b9bd; margin: 0 0 20px; }
    a.btn {
      display: inline-block; text-decoration: none; font-weight: 600; font-size: 14px;
      color: #fff; background: linear-gradient(135deg, #ff5a3c, #d92814);
      padding: 12px 22px; border-radius: 999px;
    }
    a.plain { color: #ff7a5c; }
  </style>
  <script>
    // Immediate, back-button-safe redirect for JS-enabled clients.
    window.location.replace("https://invictus-client.vercel.app/");
  </script>
</head>
<body>
  <main class="card">
    <h1>Invictus has moved</h1>
    <p>This link is retired. The live Invictus client app is now at
       <a class="plain" href="https://invictus-client.vercel.app/">invictus-client.vercel.app</a>.
       Redirecting you now…</p>
    <a class="btn" href="https://invictus-client.vercel.app/">Open the app</a>
  </main>
</body>
</html>
